import org.objectweb.asm.ClassReader
import org.objectweb.asm.ClassWriter
import org.objectweb.asm.Opcodes

plugins {
	id "fabric-loom" version "1.11.8"
}

// mod_version = "2.0.0+1.21.1" goes into fabric.mod.json; the jar is named
// EMIRemastered-1.21.1-2.0.0-Fabric.jar
def modBaseVersion = project.mod_version.split("\\+")[0]

version = project.mod_version
group = project.maven_group

base {
	archivesName = "${project.archives_base_name}-${project.minecraft_version}"
}

tasks.withType(AbstractArchiveTask).configureEach {
	archiveVersion = "${modBaseVersion}-Fabric"
}

repositories {
	maven {
		name = "Fabric"
		url = "https://maven.fabricmc.net/"
	}
	maven {
		// EMI's own maven
		name = "Sleeping Town"
		url = "https://repo.sleeping.town/"
	}
	maven {
		// JEI
		name = "BlameJared"
		url = "https://maven.blamejared.com/"
	}
	maven {
		// Mod Menu
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/releases/"
	}
	exclusiveContent {
		// Let's Do mods and Architectury at the exact pack versions
		forRepository {
			maven {
				name = "CurseMaven"
				url = "https://cursemaven.com"
			}
		}
		filter {
			includeGroup "curse.maven"
		}
	}
	mavenCentral()
}

loom {
	accessWidenerPath = file("src/main/resources/emi.accesswidener")

	mixin {
		defaultRefmapName = "emi-refmap.json"
	}

	mods {
		emi {
			sourceSet sourceSets.main
		}
	}

	runs {
		client {
			runDir "run"
		}
		server {
			runDir "run"
		}
		// Joins the singleplayer world run/saves/devworld directly.
		// prepareDevWorld copies the dev server's run/world there once if it does not exist yet.
		clientWorld {
			client()
			name = "Minecraft Client (devworld)"
			runDir "run"
			programArgs "--quickPlaySingleplayer", "devworld"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"

	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// JEMI layer (dev.emi.emi.jemi) compiles against JEI, as upstream
	modCompileOnly("mezz.jei:${project.jei_version}") {
		transitive = false
	}
	modCompileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") {
		transitive = false
	}

	// Let's Do compat module (later task); compile only, exact pack versions
	[
		"architectury-api-${project.architectury_curse}",
		"letsdo-vinery-${project.vinery_curse}",
		"letsdo-meadow-${project.meadow_curse}",
		"letsdo-herbalbrews-${project.herbalbrews_curse}",
		"letsdo-beachparty-${project.beachparty_curse}",
		"letsdo-farm-and-charm-${project.farm_and_charm_curse}",
		"letsdo-bakery-${project.bakery_curse}",
		"letsdo-candlelight-${project.candlelight_curse}",
	].each { coordinate ->
		modCompileOnly("curse.maven:${coordinate}") {
			transitive = false
		}
	}

	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
	def modVersion = project.version.toString()
	inputs.property "version", modVersion

	filesMatching("fabric.mod.json") {
		expand "version": modVersion
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = "UTF-8"
	options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

test {
	useJUnitPlatform()
}

// ---------------------------------------------------------------------------
// GlobalMixin (port of upstream EMI's generateClassLists task)
//
// emi.mixins.json lists the mixin "GlobalMixin", which has no source file. This task
// writes it as a class file: an interface annotated with
//   @Pseudo @Mixin(targets = { <every EMI class> })
// so that EmiMixinPlugin.postApply runs for every EMI class on the client. That hook
// applies EMI's own @Transform/@Extends/... annotations and reports foreign mixins into
// dev.emi.emi classes ("The following EMI classes have mixins applied to them ...").
//
// Targets: every compiled class under the roots below, except (as upstream) classes whose
// path contains "mixin" (dev.emi.emi.mixin.**, dev.emi.emi.mixinsupport.**) and the inner
// classes of EmiConfig. Upstream applied this to all classes of the EMI jar, which were all
// dev.emi.emi; later modules (dev.emi.remastered.*) are deliberately not targeted.
// ---------------------------------------------------------------------------
def globalMixinRoots = ["dev/emi/emi/"]
def synthMixinDir = layout.buildDirectory.dir("generated-class")

def generateClassLists = tasks.register("generateClassLists") {
	def classesDirs = sourceSets.main.output.classesDirs
	inputs.files(classesDirs).withPropertyName("classes")
	inputs.property("roots", globalMixinRoots)
	outputs.dir(synthMixinDir)

	doLast {
		def outDir = synthMixinDir.get().asFile
		outDir.deleteDir()
		def outputFile = new File(outDir, "dev/emi/emi/mixin/GlobalMixin.class")
		outputFile.parentFile.mkdirs()

		def classNames = new TreeSet<String>()
		classesDirs.each { File dir ->
			if (!dir.exists()) return
			dir.eachFileRecurse(groovy.io.FileType.FILES) { File file ->
				if (!file.name.endsWith(".class")) return
				def relative = dir.toPath().relativize(file.toPath()).toString().replace(File.separatorChar, '/' as char)
				if (!globalMixinRoots.any { relative.startsWith(it) }) return
				def lower = relative.toLowerCase(Locale.ROOT)
				if (lower.contains("mixin") || lower.contains('emiconfig$')) return
				classNames << relative.substring(0, relative.length() - ".class".length()).replace('/', '.')
			}
		}
		if (classNames.isEmpty()) {
			throw new GradleException("generateClassLists: no EMI classes found in ${classesDirs.files}")
		}

		// Same class file as upstream's hand-assembled bytes: Java 8 class version,
		// public abstract interface, SourceFile "GlobalMixin.java", invisible @Pseudo and
		// @Mixin(targets = {...dotted class names...}).
		def cw = new ClassWriter(0)
		cw.visit(Opcodes.V1_8, Opcodes.ACC_PUBLIC | Opcodes.ACC_INTERFACE | Opcodes.ACC_ABSTRACT,
			"dev/emi/emi/mixin/GlobalMixin", null, "java/lang/Object", null)
		cw.visitSource("GlobalMixin.java", null)
		cw.visitAnnotation("Lorg/spongepowered/asm/mixin/Pseudo;", false).visitEnd()
		def mixin = cw.visitAnnotation("Lorg/spongepowered/asm/mixin/Mixin;", false)
		def targets = mixin.visitArray("targets")
		classNames.each { targets.visit(null, it) }
		targets.visitEnd()
		mixin.visitEnd()
		cw.visitEnd()
		def bytes = cw.toByteArray()
		new ClassReader(bytes) // sanity check: must parse
		outputFile.bytes = bytes
		logger.lifecycle("generateClassLists: GlobalMixin targets ${classNames.size()} classes")
	}
}

sourceSets {
	main {
		output.dir(synthMixinDir, builtBy: generateClassLists)
	}
}

// ---------------------------------------------------------------------------
// Dev world for runClientWorld: copy the dev server's world (run/world) to
// run/saves/devworld once. Run `gradlew runServer` once first.
// ---------------------------------------------------------------------------
def runDir = layout.projectDirectory.dir("run")

def prepareDevWorld = tasks.register("prepareDevWorld", Copy) {
	description = "Copies run/world (dev server world) to run/saves/devworld if that save does not exist yet."
	from(runDir.dir("world")) {
		exclude "session.lock"
	}
	into(runDir.dir("saves/devworld"))
	onlyIf {
		def target = runDir.dir("saves/devworld/level.dat").asFile
		def source = runDir.dir("world/level.dat").asFile
		if (!source.exists() && !target.exists()) {
			throw new GradleException("No dev world: run `gradlew runServer` once to create run/world")
		}
		!target.exists()
	}
}

// A fresh client shows the accessibility onboarding screen first, which blocks quick play.
def prepareDevOptions = tasks.register("prepareDevOptions") {
	description = "Writes run/options.txt with onboardAccessibility:false if it does not exist yet."
	def options = runDir.file("options.txt").asFile
	onlyIf { !options.exists() }
	doLast {
		options.parentFile.mkdirs()
		options.text = "onboardAccessibility:false\n"
	}
}

tasks.matching { it.name == "runClientWorld" }.configureEach {
	dependsOn prepareDevWorld, prepareDevOptions
}
